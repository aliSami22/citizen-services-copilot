      الإقامة وصورتين شخصيتين، بالإضافة إلى البطاقة المنتهية.
    expected_claims: ["بطاقة الرقم القومي", "شهادة الميلاد", "الأحوال المدنية"]
    expected_citations:
      - document: doc-national-id
        section: "Article 2: Required Documents"
    should_refuse: false
    tags: [national-id, renewal, arabic]

  - id: GS-024
